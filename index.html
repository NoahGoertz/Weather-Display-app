
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Search</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <main>
        <h1>Weather Search</h1>

        <form id="weather-form">
            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="e.g. Kelowna" required>
            <button type="submit">Search</button>
        </form>

        <p id="statusMessage" role="status" aria-live="polite">Enter a city to see its temperature.</p>

        <section id="result" aria-labelledby="result-heading" hidden>
            <h2 id="result-heading">Weather Result</h2>
            <p>Location: <span id="location"></span></p>
            <p>Celsius: <span id="celsius"></span></p>
            <p>Fahrenheit: <span id="fahrenheit"></span></p>
        </section>

        <hr>

        <section>
            <button type="button" id="showGraph">
                Show past weather graph
            </button>

            <br><br>

            <section id="chart">               

                <fieldset id="timeFrame">
                    <legend>Select a Time Frame:</legend>

                    <div class="radio">
                        
                        <label for="7days">7 Days:</label>
                        <input type="radio" id="7days" name="timeFrame" value="7" checked>
                        
                        <label for="31days">31 Days:</label>
                        <input type="radio" id="31days" name="timeFrame" value="31">                        
                    </div>
                    
                </fieldset>

                <h2 id="chartHead">Past Weather Chart:</h2>
                <p id="chartStatusMessage" role="status" aria-live="polite" >Enter a city and enable chart to see graph.</p>
                
                <div id="chartContainer">
                    <canvas id="graph" aria-label="Weather chart" role="img"></canvas>
                </div>
                
            </section>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/chart.js"></script>
</body>
</html>
